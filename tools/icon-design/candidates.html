<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlarmSets Icon Candidates</title>
<style>
  :root{
    --bg:#12111a; --panel:#1b1a26; --ink:#eae7f2; --muted:#9b96ab;
    --line:#2e2c3c; --accent:#c3aaff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6}
  .wrap{max-width:980px;margin:0 auto;padding-block:40px 80px;padding-left:16px;padding-right:16px}
  h1{font-size:25px;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:14px;margin:0 0 30px}
  .cand{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px}
  .cand h2{font-size:17px;margin:0 0 3px}
  .cand h2 em{font-style:normal;color:var(--accent);font-size:13px;margin-left:8px}
  .cand p{color:var(--muted);font-size:13.5px;margin:0 0 18px}
  .row{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
  .slot{text-align:center}
  .slot span{display:block;color:var(--muted);font-size:11px;margin-top:8px;
             font-family:ui-monospace,Menlo,Consolas,monospace}
  .squircle{border-radius:22.5%;overflow:hidden;display:block}
  .circ{border-radius:50%;overflow:hidden;display:block}
  .mono{background:#ded7f0;border-radius:22.5%;overflow:hidden;display:block}
</style>
</head>
<body>
<div class="wrap">
  <h1>AlarmSets icon candidates</h1>
  <p class="sub">Marks are built on a grid from circles, arcs and one quadratic per side.
     Shown at the sizes a launcher actually uses. 48px is where an icon lives or dies.</p>
  <div id="out"></div>
</div>

<script>
const GROUND = '#4F378B';
const BG = `<rect width="108" height="108" fill="${GROUND}"/>`;

/* Bell outline as shipped: half-circle dome (r15 at 54,40), one quadratic per
   side flaring out to the rim, rounded rim corners. The flare is what stops the
   rim reading as a separate plate under a jar. */
const BELL = "M39,40 a15,15 0 0 1 30,0 q3,18 9,26 a4,4 0 0 1 -4,6 h-40 a4,4 0 0 1 -4,-6 q6,-8 9,-26 z";

function bell(bands, knob = true) {
  const rects = bands.map(([y, h]) =>
    `<rect x="18" y="${y}" width="72" height="${h}" fill="#fff"/>`).join("");
  return `
<defs><clipPath id="c${bands.length}${knob?1:0}"><path d="${BELL}"/></clipPath></defs>
${knob ? '<circle cx="54" cy="22" r="4.5" fill="#fff"/>' : ''}
<g clip-path="url(#c${bands.length}${knob?1:0})">${rects}</g>
<circle cx="54" cy="79" r="4.5" fill="#fff"/>`;
}

/* A — three bands, 14/13/12 visible. Gaps at 39-43 and 56-60, 4dp each. */
const A = bell([[23,16],[43,13],[60,13]]);   // shipped geometry

/* B — one cut. Bolder, fewer parts, reads faster small. */
const B = bell([[23,33],[60,13]]);

/* C — twin-bell wind-up clock, the instrument the app's signature tone imitates. */
const C = `
<circle cx="33" cy="32" r="11" fill="#fff"/>
<circle cx="75" cy="32" r="11" fill="#fff"/>
<rect x="49" y="26" width="10" height="9" rx="3" fill="#fff"/>
<circle cx="54" cy="62" r="26" fill="#fff"/>
<rect x="24" y="80" width="12" height="10" rx="5" fill="#fff" transform="rotate(-30 30 85)"/>
<rect x="72" y="80" width="12" height="10" rx="5" fill="#fff" transform="rotate(30 78 85)"/>
<g fill="${GROUND}">
  <rect x="42" y="52" width="24" height="5" rx="2.5"/>
  <rect x="42" y="60" width="16" height="5" rx="2.5"/>
  <rect x="42" y="68" width="24" height="5" rx="2.5"/>
</g>`;

const CANDS = [
  ["A", "Banded bell", "recommended",
   "A bell reads as “alarm” instantly; the two cuts turn it into a stack. One idea, and the outline is a half-circle, two symmetric curves and a rounded rim."],
  ["B", "Banded bell, one cut", "boldest",
   "Same construction, a single cut. Heavier and faster to read at 48px, but says “stack” less clearly."],
  ["C", "Twin-bell clock", "most literal",
   "The wind-up clock the app’s signature ringtone imitates, with the set stacked inside its face. Charming, and the busiest of the three when small."],
];
const ART = { A, B, C };
const SIZES = [[48,"48 · list"],[72,"72 · grid"],[108,"108"],[192,"192 · store"]];

document.getElementById('out').innerHTML = CANDS.map(([id, name, tag, desc]) => {
  const art = ART[id];
  const sizes = SIZES.map(([s, label]) =>
    `<div class="slot"><svg class="squircle" width="${s}" height="${s}" viewBox="0 0 108 108"
       role="img" aria-label="${name} at ${s} pixels">${BG}${art}</svg><span>${label}</span></div>`).join("");
  const circle = `<div class="slot"><svg class="circ" width="72" height="72" viewBox="0 0 108 108"
       role="img" aria-label="${name} under a circular mask">${BG}${art}</svg><span>circle mask</span></div>`;
  const mono = `<div class="slot"><svg class="mono" width="72" height="72" viewBox="0 0 108 108"
       role="img" aria-label="${name} as a themed monochrome icon">`
       + art.replace(/#fff/g, '#31245c').replace(new RegExp(GROUND, 'g'), '#ded7f0')
       + `</svg><span>themed</span></div>`;
  return `<div class="cand"><h2>${id} — ${name}<em>${tag}</em></h2><p>${desc}</p>
          <div class="row">${sizes}${circle}${mono}</div></div>`;
}).join("");
</script>
</body>
</html>
