      <rect id="bar-2" x="190" y="209" width="132" height="36" rx="18"/>
      <rect id="bar-3" x="161" y="263" width="190" height="36" rx="18"/>
      <rect id="bar-4-rim" x="130" y="317" width="252" height="36" rx="18"/>
