<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Concept Sheet</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#141218;color:#e8e4f0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
     padding:16px 14px;width:790px}
h1{font-size:15px;margin-bottom:12px;font-weight:600}
.row{display:flex;gap:10px}
.col{flex:1;text-align:center}
.big{width:126px;height:126px;border-radius:22.5%;display:block;margin:0 auto 8px}
.name{font-size:11px;font-weight:600;margin-bottom:7px}
.strip{display:flex;justify-content:center;align-items:center;gap:7px}
.strip img{display:block;border-radius:22.5%}
.strip .r{border-radius:50%}
</style></head><body>
<h1>AlarmSets — 126px, then 44 / 30 / round-crop</h1>
<div class="row">
    <div class="col">
      <img class="big" src="concepts/current.svg" alt="current · shipped">
      <div class="name">current · shipped</div>
      <div class="strip">
        <img src="concepts/current.svg" width="44" height="44" alt="">
        <img src="concepts/current.svg" width="30" height="30" alt="">
        <img class="r" src="concepts/current.svg" width="44" height="44" alt="">
      </div>
    </div>
    <div class="col">
      <img class="big" src="concepts/concept-1.svg" alt="1 · two bells">
      <div class="name">1 · two bells</div>
      <div class="strip">
        <img src="concepts/concept-1.svg" width="44" height="44" alt="">
        <img src="concepts/concept-1.svg" width="30" height="30" alt="">
        <img class="r" src="concepts/concept-1.svg" width="44" height="44" alt="">
      </div>
    </div>
    <div class="col">
      <img class="big" src="concepts/concept-2.svg" alt="2 · stack → bell">
      <div class="name">2 · stack → bell</div>
      <div class="strip">
        <img src="concepts/concept-2.svg" width="44" height="44" alt="">
        <img src="concepts/concept-2.svg" width="30" height="30" alt="">
        <img class="r" src="concepts/concept-2.svg" width="44" height="44" alt="">
      </div>
    </div>
    <div class="col">
      <img class="big" src="concepts/concept-3.svg" alt="3 · clock in a bell">
      <div class="name">3 · clock in a bell</div>
      <div class="strip">
        <img src="concepts/concept-3.svg" width="44" height="44" alt="">
        <img src="concepts/concept-3.svg" width="30" height="30" alt="">
        <img class="r" src="concepts/concept-3.svg" width="44" height="44" alt="">
      </div>
    </div>
    <div class="col">
      <img class="big" src="concepts/concept-4.svg" alt="4 · switch + bell">
      <div class="name">4 · switch + bell</div>
      <div class="strip">
        <img src="concepts/concept-4.svg" width="44" height="44" alt="">
        <img src="concepts/concept-4.svg" width="30" height="30" alt="">
        <img class="r" src="concepts/concept-4.svg" width="44" height="44" alt="">
      </div>
    </div></div>
</body></html>
